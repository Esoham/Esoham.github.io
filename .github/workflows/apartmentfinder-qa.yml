name: ApartmentFinder QA
on:
  push:
    paths:
      - 'projects/apartmentfinder/**'
      - '.github/workflows/apartmentfinder-qa.yml'
  pull_request:
    paths:
      - 'projects/apartmentfinder/**'
      - '.github/workflows/apartmentfinder-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check projects/apartmentfinder/app.mjs
          node --check projects/apartmentfinder/live.mjs
          node --check projects/apartmentfinder/feedback.mjs
          node --check projects/apartmentfinder/live-utils.mjs
          node --check projects/apartmentfinder/logic.mjs
      - name: Test rental data adapter without API requests
        run: python3 -m unittest discover -s scripts -p 'test_sync_rentcast.py' -v
      - name: Run client regression tests
        run: node --test projects/apartmentfinder/tests/*.test.mjs
      - name: Generate non-verification rental quality report
        run: node projects/apartmentfinder/scripts/audit-listings.mjs
      - name: Upload rental review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apartmentfinder-listing-review-queue
          path: projects/apartmentfinder/listing-quality-report.md
          if-no-files-found: ignore

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/apartmentfinder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install end-to-end testing dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Test renter journeys on desktop and mobile
        run: npm run test:e2e
      - name: Upload failure traces and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apartmentfinder-playwright-report
          path: |
            projects/apartmentfinder/playwright-report/
            projects/apartmentfinder/test-results/
          if-no-files-found: ignore
