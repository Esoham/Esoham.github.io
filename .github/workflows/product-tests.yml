name: Portfolio product unit tests
on:
  push:
    paths:
      - 'projects/resolveiq/priority-engine.mjs'
      - 'projects/resolveiq/priority-engine.test.mjs'
      - '.github/workflows/product-tests.yml'
  pull_request:
    paths:
      - 'projects/resolveiq/**'
      - '.github/workflows/product-tests.yml'
jobs:
  resolveiq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ResolveIQ unit tests
        run: node --test projects/resolveiq/priority-engine.test.mjs
